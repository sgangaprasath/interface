name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to sgangaprasath.github.io
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          # Top-level folders in sgangaprasath.github.io that are maintained by
          # hand, not built from this repo. The deploy never deletes these.
          # Add a folder's name here before adding it to the Pages repo.
          KEEP: "CCSD AM5000"
        run: |
          git clone https://x-access-token:${PERSONAL_TOKEN}@github.com/sgangaprasath/sgangaprasath.github.io.git pages-repo
          # Remove the previous build, but keep the hand-maintained folders
          # above. Hidden files (.git, .github, .nojekyll) are never matched.
          for path in pages-repo/*; do
            name=$(basename "$path")
            case " $KEEP " in
              *" $name "*) echo "Keeping $name" ;;
              *) rm -rf "$path" ;;
            esac
          done
          # Stop rather than overwrite a hand-maintained folder with a build output.
          for name in $KEEP; do
            if [ -e "out/$name" ]; then
              echo "out/$name would overwrite the hand-maintained $name folder" >&2
              exit 1
            fi
          done
          cp -r out/* pages-repo/
          touch pages-repo/.nojekyll
          cd pages-repo
          git config user.name sgangaprasath
          git config user.email sgangaprasath@users.noreply.github.com
          git add .
          git commit -m "deploy interface site"
          git push