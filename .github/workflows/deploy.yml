name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Clone pages repo and deploy
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          git clone https://x-access-token:${PERSONAL_TOKEN}@github.com/sgangaprasath/sgangaprasath.github.io.git pages-repo
          rm -rf pages-repo/interface
          mkdir -p pages-repo/interface
          cp -r out/* pages-repo/interface/
          cd pages-repo
          git config user.name sgangaprasath
          git config user.email sgangaprasath@users.noreply.github.com
          git add interface/
          git commit -m "deploy interface site"
          git push